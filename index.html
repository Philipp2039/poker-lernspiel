   Spielablauf
   ========================================================= */
function newGame(){
  G.players=[{name:'Du',isHuman:true,color:'#f5c451',title:'',desc:'',chips:1000},...BOT_DEFS.map(b=>({...b,chips:1000}))];
  G.players.forEach((p,i)=>Object.assign(p,{id:i,hand:[],bet:0,total:0,folded:false,allIn:false,acted:false,raises:0,inHand:true}));
  G.dealer=(Math.random()*N)|0;G.handNo=0;G.stats={won:0};
  buildTable();
  $('#log').innerHTML='';
  log('Neues Spiel! Jeder startet mit <b>1.000 Chips</b>. Blinds: <b>10 / 20</b>.','Wer am Ende alle Chips hat, gewinnt. Wer keine Chips mehr hat, scheidet aus.');
  BOT_DEFS.forEach(b=>log(`<b style="color:${b.color}">${b.name}</b> – ${b.title}`,b.desc));
  startHand();
}

async function startHand(){
  G.handOver=false;ff=false;G.revealed=false;G.handNo++;
  $('#ffBtn').classList.add('hidden');
  hideBanner();
  document.querySelectorAll('#board .slot').forEach(s=>s.innerHTML='');
  G.players.forEach((p,i)=>{
    $('#hole'+i).innerHTML='';$('#tag'+i).className='tag';$('#seat'+i).classList.remove('winner','turn','thinking');
    Object.assign(p,{hand:[],bet:0,total:0,folded:false,allIn:false,acted:false,raises:0,inHand:p.chips>0});
  });
  clearBubbles(false);
  G.dealer=nextIdx(G.dealer,p=>p.inHand);
  const n=G.players.filter(p=>p.inHand).length;
  G.sbI=n===2?G.dealer:nextIdx(G.dealer,p=>p.inHand);
  G.bbI=nextIdx(G.sbI,p=>p.inHand);
  G.board=[];G.deck=shuffle(newDeck());G.pot=0;G.currentBet=0;G.minRaise=G.bb;
  showArea('act');setControls(false);
  $('#handInfo').innerHTML=`Hand <b>#${G.handNo}</b> · Blinds <b>10/20</b> · Gewonnen: <b>${G.stats.won}</b>`;
  renderAll();renderPositions();
  log(`Hand #${G.handNo}`,'','head');
  log(`<b>${nm(G.players[G.dealer])}</b> ${G.dealer===0?'bist':'ist'} Dealer (Button „D“).`,'Der Button wandert nach jeder Hand einen Platz nach links (im Uhrzeigersinn). So muss jeder mal die Blinds zahlen.');
  setStage('preflop');
  $('#ctrlInfo').innerHTML='Die Blinds werden gesetzt …';
  updateCoach();
  await sleep(600);
  await postBlind(G.sbI,G.sb,'Small Blind');
  await postBlind(G.bbI,G.bb,'Big Blind');
  G.currentBet=G.bb;
  log('Die <b>Blinds</b> sind Pflichteinsätze.','Ohne sie könnte jeder ewig auf Top-Karten warten. Der Small Blind ist die Hälfte des Big Blinds.');
  // Karten austeilen: 2 Runden, beginnend beim Small Blind
  $('#ctrlInfo').innerHTML='Karten werden ausgeteilt …';
  for(let r=0;r<2;r++){let i=G.sbI;for(let k=0;k<n;k++){const p=G.players[i];const c=G.deck.pop();p.hand.push(c);dealTo($('#hole'+i),c);await sleep(120);i=nextIdx(i,q=>q.inHand);}}
  await sleep(500);
  if(G.players[0].inHand){$('#hole0').querySelectorAll('.card').forEach(c=>c.classList.add('up'));sound('card');}
  await sleep(500);
  updateCoach();

  const streets=['preflop','flop','turn','river'];
  for(let si=0;si<4;si++){
    if(si>0){setStage(streets[si]);await dealBoard(si===1?3:1,streets[si]);updateCoach();}
    const ac=actors();
    if(ac.length>=2||(ac.length===1&&ac[0].bet<G.currentBet)){
      const first=si===0?nextIdx(G.bbI,canAct):nextIdx(G.dealer,canAct);
      await bettingRound(first);
    }
    await collectBets();
    if(alive().length===1)break;
    if(actors().length<=1&&!G.revealed&&G.board.length<5){
      G.revealed=true;await revealCards();
      log('Alle (bis auf höchstens einen) sind <b>All-in</b> – die Karten werden aufgedeckt.','Weil niemand mehr setzen kann, werden die restlichen Karten einfach ausgeteilt. Spannend!','street');
      await sleep(900);
    }
  }
  await finishHand();
}

async function postBlind(i,amt,label){
  const p=G.players[i],a=Math.min(amt,p.chips);
  await putChips(p,a);if(p.chips===0)p.allIn=true;
  bubble(i,`${label==='Small Blind'?'SB':'BB'} ${a}`,'blind');
  log(`<b>${nm(p)}</b> ${p.isHuman?'setzt':'setzt'} den <b>${label}</b> (${a}).`);
  renderSeat(i);
}
async function putChips(p,amt){
  if(amt<=0)return;
  const i=idx(p);p.chips-=amt;p.bet+=amt;p.total+=amt;
  renderSeat(i);$('#bet'+i).classList.remove('show');
  await flyChips($('#seat'+i+' .plate'),$('#bet'+i),Math.min(5,1+Math.floor(amt/60)));
  renderSeat(i);renderPot();
}
async function collectBets(){
  const ps=G.players.filter(p=>p.bet>0);
  if(ps.length){
    await sleep(300);
    const potChip=$('#pot .potchip');
    const anims=ps.map(p=>{const i=idx(p);const b=$('#bet'+i);const f=flyChips(b,potChip,3);b.classList.remove('show');return f;});
    await Promise.all(anims);
    ps.forEach(p=>{G.pot+=p.bet;p.bet=0;});
    renderAll();
  }
  G.currentBet=0;G.minRaise=G.bb;
  G.players.forEach(p=>{p.acted=false;p.raises=0;});
  clearBubbles();
}
async function dealBoard(n,street){
  await sleep(350);
  G.deck.pop(); // Burn Card
  const slots=document.querySelectorAll('#board .slot');
  const els=[];
  for(let k=0;k<n;k++){const c=G.deck.pop();G.board.push(c);els.push(await dealTo(slots[G.board.length-1],c));await sleep(60);}
  await sleep(200);
  for(const e of els){e.classList.add('up');sound('card');await sleep(140);}
  await sleep(400);
  const names={flop:'Der Flop',turn:'Der Turn',river:'Der River'};
  log(`${names[street]}: ${G.board.slice(-n).map(cardStr).join(' ')}`,street==='flop'?'Vor dem Austeilen wird eine Karte verdeckt weggelegt („Burn Card“) – ein alter Schutz gegen Schummeln.':'',`street`);
}

async function bettingRound(first){
  let i=first,guard=0;
  while(guard++<300&&i>=0){
    if(alive().length===1)return;
    const ac=actors();
    if(ac.length===0)return;
    if(ac.every(p=>p.acted&&p.bet===G.currentBet))return;
    if(ac.length===1&&ac[0].bet>=G.currentBet)return;
    const p=G.players[i];
    if(canAct(p)&&(!p.acted||p.bet<G.currentBet)){
      setTurn(i);
      const a=p.isHuman?await askHuman(p):await botAct(p);
      await applyAction(p,a);
      setTurn(-1);
      updateCoach();
    }
    i=(i+1)%N;
  }
}

async function applyAction(p,a){
  const i=idx(p),toCall=G.currentBet-p.bet;
  let kind=a.type,amt=0,to=0;
  if(kind==='fold'){
    p.folded=true;sound('fold');
    const cards=[...$('#hole'+i).querySelectorAll('.card')];
    if(p.isHuman)cards.forEach(c=>c.classList.add('folded'));
    else{const pc=center($('#pot'));await Promise.all(cards.map(c=>{const b=center(c);return c.animate([{transform:'none',opacity:1},{transform:`translate(${(pc.x-b.x)*.4}px,${(pc.y-b.y)*.4}px) rotate(20deg) scale(.7)`,opacity:0}],{duration:400*SPD(),easing:'ease-in',fill:'forwards'}).finished;}));cards.forEach(c=>c.remove());}
  }else if(kind==='call'){amt=Math.min(toCall,p.chips);await putChips(p,amt);}
  else if(kind==='raise'){
    to=Math.min(a.to,p.bet+p.chips);
    if(to<=G.currentBet){kind=toCall>0?'call':'check';amt=Math.min(toCall,p.chips);if(amt)await putChips(p,amt);}
    else{const by=to-G.currentBet;if(by>=G.minRaise)G.minRaise=by;kind=G.currentBet===0?'bet':'raise';G.currentBet=to;amt=to-p.bet;await putChips(p,amt);}
  }
  p.acted=true;
  const allIn=!p.folded&&p.chips===0;
  if(allIn)p.allIn=true;
  renderSeat(i);
  // Sprechblase + Erklärung
  const you=p.isHuman,n=`<b>${nm(p)}</b>`;
  const T={
    fold:[`${n} ${you?'steigst':'steigt'} aus (Fold).`,'Fold = Karten weglegen. Man verliert alles, was man in dieser Hand schon gesetzt hat – aber keinen Chip mehr.','Fold'],
    check:[`${n} ${you?'checkst':'checkt'}.`,'Check = „Ich setze nichts, bleibe aber drin.“ Das geht nur, wenn man nichts nachzahlen muss.','Check'],
    call:[`${n} ${you?'gehst':'geht'} mit (Call): ${amt}.`,`Call = den höchsten Einsatz dieser Runde (${G.currentBet}) ausgleichen, um im Spiel zu bleiben.`,`Call ${amt}`],
    bet:[`${n} ${you?'setzt':'setzt'} ${to} (Bet).`,`Bet = der erste Einsatz in einer Setzrunde. Wer weiterspielen will, muss jetzt mindestens ${to} bringen.`,`Bet ${to}`],
    raise:[`${n} ${you?'erhöhst':'erhöht'} auf ${to} (Raise).`,`Raise = den Einsatz erhöhen. Das zeigt Stärke – oder ist ein Bluff. Alle anderen müssen jetzt ${to} bringen oder aussteigen.`,`Raise ${to}`],
  }[kind];
  let sub=T[1];
  if(allIn){sub+=` <b>All-in!</b> ${nm(p)} ${you?'hast':'hat'} alle Chips gesetzt. Wer All-in ist, kann nur so viel von jedem Gegner gewinnen, wie er selbst gesetzt hat – der Rest kommt in einen Side Pot.`;}
  if(!you&&a.bluff&&settings.tips)sub+=' <i>(Psst: Das hier war ein Bluff – das erfährst nur du als Lernender.)</i>';
  bubble(i,allIn&&kind!=='fold'?`All-in ${p.total}`:T[2],allIn&&kind!=='fold'?'allin':kind);
  log(T[0],sub);
}

/* ---------- Bots ---------- */
async function botAct(p){
  const i=idx(p);
  $('#seat'+i).classList.add('thinking');
  $('#ctrlInfo').innerHTML=`<b>${p.name}</b> denkt nach …`;
  const nOpp=Math.max(1,alive().length-1);
  const eq=equity(p.hand,G.board,nOpp,G.board.length?420:320);
  await sleep(650+Math.random()*750);
  $('#seat'+i).classList.remove('thinking');
  const s=p.style,toCall=G.currentBet-p.bet,pt=potTotal();
  const potOdds=toCall>0?toCall/(pt+toCall):0,strength=eq*(nOpp+1);
  const maxTo=p.bet+p.chips,minTo=Math.min(G.currentBet+G.minRaise,maxTo);
  const othersCanAct=actors().filter(q=>q!==p).length>0;
  const canRaise=maxTo>G.currentBet&&p.raises<2&&othersCanAct;
  const wantRaise=canRaise&&strength>=s.raiseAt&&Math.random()<s.aggr+(strength-s.raiseAt)*.4;
  const bluff=!wantRaise&&canRaise&&G.board.length>0&&strength<.9&&Math.random()<s.bluff&&toCall<=pt*.5;
  if(wantRaise||bluff){
    let to;
    if(G.board.length===0)to=G.currentBet<=G.bb?G.bb*(2.5+Math.random()*1.5):G.currentBet*(2.5+Math.random()*.8);
    else to=G.currentBet+(pt+toCall)*(.45+Math.random()*.55);
    if(eq>.8&&Math.random()<.2)to=maxTo;
    to=Math.round(to/5)*5;to=Math.max(minTo,Math.min(maxTo,to));
    if(to>=maxTo*.85)to=maxTo;
    p.raises++;
    return {type:'raise',to,bluff};
  }
  if(toCall===0)return {type:'check'};
  if(eq>=potOdds*s.callMult)return {type:'call'};
  if(strength>=s.callStrength&&toCall<=p.chips*.35)return {type:'call'};
  if(toCall<=Math.max(G.bb,p.chips*.04)&&strength>=s.callStrength*.75)return {type:'call'};
  return {type:'fold'};
}

/* ---------- Mensch ---------- */
function askHuman(p){
  return new Promise(res=>{
    G.resolveHuman=res;
    sound('turn');
    setControls(true);
    updateCoach(true);
  });
}
function humanDo(a){if(!G.resolveHuman)return;const r=G.resolveHuman;G.resolveHuman=null;setControls(false);r(a);}
function raiseBounds(){
  const me=G.players[0],maxTo=me.bet+me.chips,minTo=Math.min(G.currentBet+G.minRaise,maxTo);
  return {minTo,maxTo,can:maxTo>G.currentBet&&actors().some(q=>q!==me)};
}
function presetTo(kind){
  const me=G.players[0],{minTo,maxTo}=raiseBounds(),toCall=G.currentBet-me.bet,pt=potTotal();
  let to={min:minTo,half:G.currentBet+.5*(pt+toCall),pot:G.currentBet+(pt+toCall),all:maxTo}[kind];
  if(kind!=='all')to=Math.round(to/5)*5;
  return Math.max(minTo,Math.min(maxTo,to));
}
function setControls(on){
  const me=G.players[0],toCall=Math.max(0,G.currentBet-me.bet);
  const fold=$('#btnFold'),call=$('#btnCall'),raise=$('#btnRaise'),rng=$('#raiseRange');
  if(!on){
    [fold,call,raise,rng,...document.querySelectorAll('.pre')].forEach(b=>b.disabled=true);
    document.querySelectorAll('.act').forEach(b=>b.classList.remove('rec'));
    $('#raiseAmt').textContent='–';
    if(!G.handOver)$('#ctrlInfo').innerHTML=me.folded||!me.inHand?'Du bist in dieser Hand nicht mehr dabei.':me.allIn?'Du bist All-in – jetzt heißt es Daumen drücken!':'Warte auf die anderen Spieler …';
    $('#ffBtn').classList.toggle('hidden',!(me.folded||!me.inHand||me.allIn)||G.handOver);
    return;
  }
  fold.disabled=false;call.disabled=false;
  const callAmt=Math.min(toCall,me.chips);
  call.innerHTML=toCall===0?'<kbd>C</kbd>Check<small>Nichts setzen, drinbleiben</small>':`<kbd>C</kbd>Call ${callAmt}<small>${callAmt>=me.chips?'Mitgehen – All-in!':'Mitgehen'}</small>`;
  fold.innerHTML=`<kbd>F</kbd>Fold<small>${toCall===0?'Aufgeben (unnötig!)':'Aussteigen'}</small>`;
  const {minTo,maxTo,can}=raiseBounds();
  raise.disabled=!can;rng.disabled=!can;document.querySelectorAll('.pre').forEach(b=>b.disabled=!can);
  if(can){rng.min=minTo;rng.max=maxTo;rng.step=minTo===maxTo?1:5;rng.value=presetTo(G.board.length?'half':'min');if(G.board.length===0&&G.currentBet<=G.bb)rng.value=Math.min(maxTo,Math.max(minTo,G.bb*3));}
  updateRaiseLabel();
  $('#ctrlInfo').innerHTML=toCall===0?'<b>Du bist dran!</b> Niemand hat gesetzt – du kannst gratis checken.':`<b>Du bist dran!</b> Um weiterzuspielen, musst du <b>${callAmt}</b> zahlen.`;
  $('#explain').innerHTML=toCall===0?(TOUCH?'Tipp: Die ausführliche Erklärung findest du weiter unten beim Coach.':'Tipp: Fahre über die Tasten für Erklärungen. Tastatur: <b>F</b> = Fold, <b>C</b> = Check/Call, <b>R</b> = Bet/Raise.'):`Der höchste Einsatz in dieser Runde ist <b>${G.currentBet}</b>, du hast bisher <b>${me.bet}</b> gesetzt – also fehlen dir <b>${toCall}</b>.`;
}
function updateRaiseLabel(){
  const me=G.players[0],rng=$('#raiseRange'),v=+rng.value,raise=$('#btnRaise');
  if(rng.disabled){raise.innerHTML=`<kbd>R</kbd>${G.currentBet===0?'Bet':'Raise'}<small>nicht möglich</small>`;$('#raiseAmt').textContent='–';return;}
  const all=v>=me.bet+me.chips;
  $('#raiseAmt').textContent=v;
  raise.innerHTML=G.currentBet===0?`<kbd>R</kbd>${all?'All-in':'Bet'} ${v}<small>Setzen</small>`:`<kbd>R</kbd>${all?'All-in':'Raise auf'} ${v}<small>Erhöhen</small>`;
}
const EXPLAIN={
  btnFold:()=>G.currentBet-G.players[0].bet===0?'<b>Fold</b> = Karten wegwerfen und aufgeben. Gerade ist das unnötig: Ein <b>Check</b> kostet nichts und du bleibst im Spiel!':'<b>Fold</b> = Du wirfst deine Karten weg und steigst aus dieser Hand aus. Was du schon gesetzt hast, ist verloren – aber du riskierst nichts mehr.',
  btnCall:()=>{const t=G.currentBet-G.players[0].bet;return t===0?'<b>Check</b> = „Ich setze nichts und gebe weiter.“ Du bleibst in der Hand, ohne Chips zu riskieren. Möglich, weil in dieser Runde noch niemand gesetzt hat.':`<b>Call</b> = Du zahlst ${Math.min(t,G.players[0].chips)} und gleichst damit den höchsten Einsatz aus. Du bleibst im Spiel und siehst die nächste Karte (oder den Showdown).`;},
  btnRaise:()=>G.currentBet===0?'<b>Bet</b> = Du setzt als Erster in dieser Runde. Die anderen müssen mitgehen, erhöhen oder aussteigen. Gut, wenn du eine starke Hand hast – oder als Bluff.':'<b>Raise</b> = Du erhöhst den Einsatz. Die anderen müssen den neuen Betrag bringen, sonst sind sie raus. Zeigt Stärke und kann Gegner vertreiben. Wähle die Höhe mit dem Regler.',
};
function showArea(which){$('#actArea').classList.toggle('hidden',which!=='act');$('#nextArea').classList.toggle('hidden',which!=='next');}

/* ---------- Showdown & Auszahlung ---------- */
async function revealCards(){
  for(const p of alive()){if(p.isHuman)continue;$('#hole'+idx(p)).querySelectorAll('.card').forEach(c=>c.classList.add('up'));sound('card');await sleep(250);}
}
function buildPots(){
  const levels=[...new Set(alive().map(p=>p.total))].sort((a,b)=>a-b);
  let prev=0;const pots=[];
  for(const L of levels){
    let amt=0;for(const p of G.players)amt+=Math.max(0,Math.min(p.total,L)-prev);
    const elig=alive().filter(p=>p.total>=L);
    if(amt>0){const last=pots[pots.length-1];if(last&&last.elig.length===elig.length)last.amount+=amt;else pots.push({amount:amt,elig});}
    prev=L;
  }
  const total=G.players.reduce((s,p)=>s+p.total,0),sum=pots.reduce((s,p)=>s+p.amount,0);
  if(total>sum&&pots.length)pots[pots.length-1].amount+=total-sum;
  return pots;
}
async function finishHand(){
  setTurn(-1);
  const al=alive();
  const me=G.players[0];
  if(al.length===1){
    const w=al[0],amt=G.pot;
    await sleep(400);
    await flyChips($('#pot .potchip'),$('#seat'+idx(w)+' .plate'),6);
    w.chips+=amt;G.pot=0;renderAll();
    $('#seat'+idx(w)).classList.add('winner');sound('win');
    if(w.isHuman)G.stats.won++;
    showBanner(`${nm(w)} ${w.isHuman?'gewinnst':'gewinnt'} ${amt}!`);
    log(`🏆 <b>${nm(w)}</b> ${w.isHuman?'gewinnst':'gewinnt'} <b>${amt}</b> ohne Showdown.`,'Alle anderen sind ausgestiegen. Wer als Letzter übrig bleibt, gewinnt den Pot – und muss seine Karten nicht einmal zeigen. Genau so funktioniert ein erfolgreicher Bluff!','win');
  }else{
    setStage('showdown');
    if(!G.revealed){await revealCards();}
    await sleep(500);
    const res=new Map();
    al.forEach(p=>{const ev=evaluate([...p.hand,...G.board]);res.set(p,ev);const t=$('#tag'+idx(p));t.textContent=ev.name;t.className='tag show';});
    log('Showdown!','Jetzt zählt nur noch, wer die beste 5-Karten-Hand hat.','street');
    al.forEach(p=>log(`<b>${nm(p)}</b>: ${mini(p.hand)} → <b>${res.get(p).name}</b> (${res.get(p).desc})`));
    await sleep(900);
    const pots=buildPots();
    let potNo=0;
    for(const pot of pots){
      const label=pots.length>1?(potNo===0?'Hauptpot':`Side Pot ${potNo}`):'Pot';potNo++;
      if(pot.elig.length===1){
        const p=pot.elig[0];
        await flyChips($('#pot .potchip'),$('#seat'+idx(p)+' .plate'),3);
        p.chips+=pot.amount;renderAll();
        log(`<b>${nm(p)}</b> ${p.isHuman?'bekommst':'bekommt'} ${pot.amount} zurück.`,'Diesen Teil hat niemand mitgehen können (die anderen waren All-in mit weniger Chips). Nicht bezahlte Einsätze gehen an den Spieler zurück.');
        continue;
      }
      const best=Math.max(...pot.elig.map(p=>res.get(p).score));
      const winners=pot.elig.filter(p=>res.get(p).score===best);
      // Gewinnerkarten hervorheben
      tableEl.querySelectorAll('.card').forEach(c=>c.classList.remove('win','dim','hl'));
      const winIds=new Set();winners.forEach(w=>res.get(w).cards.forEach(c=>winIds.add(cid(c))));
      tableEl.querySelectorAll('#board .card,.hole .card').forEach(c=>{if(winIds.has(+c.dataset.id))c.classList.add('win');else c.classList.add('dim');});
      winners.forEach(w=>{$('#seat'+idx(w)).classList.add('winner');$('#tag'+idx(w)).classList.add('win');});
      const share=Math.floor(pot.amount/winners.length);let rest=pot.amount-share*winners.length;
      for(const w of winners){
        await flyChips($('#pot .potchip'),$('#seat'+idx(w)+' .plate'),5);
        w.chips+=share+(rest>0?rest:0);rest=0;renderAll();
      }
      sound('win');
      const wev=res.get(winners[0]);
      if(winners.some(w=>w.isHuman))G.stats.won++;
      if(winners.length>1){
        showBanner(`Split Pot! ${winners.map(nm).join(' & ')} teilen ${pot.amount}`);
        log(`🤝 <b>${label}</b> (${pot.amount}) wird geteilt: ${winners.map(w=>`<b>${nm(w)}</b>`).join(' und ')} haben exakt gleich gute Hände (${wev.desc}).`,'Bei Gleichstand wird geteilt. Die Farbe (♠♥♦♣) spielt beim Poker für den Rang keine Rolle!','win');
      }else{
        const w=winners[0];
        const losers=pot.elig.filter(p=>p!==w).sort((a,b)=>res.get(b).score-res.get(a).score);
        const lev=res.get(losers[0]);
        let why;
        if(wev.cat>lev.cat)why=`${wev.name} schlägt ${lev.name} – in der Rangfolge steht ${wev.name} höher.`;
        else{
          const wc=wev.cards.map(c=>c.r),lc=lev.cards.map(c=>c.r);let k=0;while(k<5&&wc[k]===lc[k])k++;
          const main={0:1,1:2,2:4,3:3,4:5,5:5,6:5,7:4,8:5}[wev.cat];
          why=`Beide haben ${wev.name}. Dann entscheiden die Kartenwerte: `+(k<main?`${nm(w)} ${w.isHuman?'hast':'hat'} die höheren Hauptkarten (${RN[wc[k]]} gegen ${RN[lc[k]]}).`:`Die Hauptkarten sind gleich – also entscheidet die Beikarte, der <b>Kicker</b>: ${RN[wc[k]]} schlägt ${RN[lc[k]]}.`);
        }
        showBanner(`${nm(w)} ${w.isHuman?'gewinnst':'gewinnt'} ${pot.amount} mit ${wev.name}`);
        log(`🏆 <b>${nm(w)}</b> ${w.isHuman?'gewinnst':'gewinnt'} den ${label} (<b>${pot.amount}</b>) mit <b>${wev.desc}</b>.`,why,'win');
      }
      await sleep(1300);
    }
    G.pot=0;renderAll();
  }
  G.handOver=true;
  // Ausgeschiedene Spieler
  G.players.forEach((p,i)=>{if(!p.isHuman&&p.chips<=0&&p.inHand){p.inHand=false;log(`💀 <b>${p.name}</b> hat keine Chips mehr und scheidet aus.`);renderSeat(i);}});
  $('#handInfo').innerHTML=`Hand <b>#${G.handNo}</b> · Blinds <b>10/20</b> · Gewonnen: <b>${G.stats.won}</b>`;
  setControls(false);$('#ffBtn').classList.add('hidden');
  renderPhase();renderHandBox();$('#oddsBox').classList.add('hidden');$('#mcoach').classList.remove('show');
  tableEl.querySelectorAll('.card.hl').forEach(c=>c.classList.remove('hl'));
  if(me.chips<=0){me.inHand=false;renderSeat(0);setTimeout(()=>openModal(`<h2>Keine Chips mehr 😕</h2><p>Du bist ausgeschieden – nach ${G.handNo} Händen. Kein Problem: Genau so lernt man Poker! Schau dir im Spielverlauf an, wo es schiefging.</p><p><b>Typische Anfängerfehler:</b></p><ul><li>Zu viele schwache Starthände spielen</li><li>Mit einem kleinen Paar zu viel setzen</li><li>Draws hinterherjagen, obwohl die Pot Odds nicht stimmen</li></ul><button class="big" onclick="closeModal();newGame()">Neues Spiel starten</button>`,true),1200);return;}
  if(G.players.every(p=>p.isHuman||p.chips<=0)){setTimeout(()=>openModal(`<h2>Du hast gewonnen! 🏆</h2><p>Du hast alle Chips am Tisch eingesammelt – nach ${G.handNo} Händen. Anna, Ben, Carla und Dieter sind geschlagen!</p><button class="big" onclick="closeModal();newGame()">Noch einmal spielen</button>`,true),1200);return;}
  $('#ctrlInfo').innerHTML='Die Hand ist vorbei. Schau dir in Ruhe an, was passiert ist – dann weiter!';
  $('#explain').innerHTML='Im <b>Spielverlauf</b> rechts steht genau, wer was gemacht hat und warum gewonnen wurde. Taste <b>Enter</b> startet die nächste Hand.';
  showArea('next');
}

/* =========================================================
   Modals: Anleitung, Rangfolge, Begriffe
   ========================================================= */
let modalLocked=false;
function openModal(html,locked=false){$('#modalBody').innerHTML=html;$('#modal').classList.add('open');modalLocked=locked;$('#modalX').classList.toggle('hidden',locked);}
function closeModal(){$('#modal').classList.remove('open');modalLocked=false;}
$('#modalX').onclick=closeModal;
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!modalLocked)closeModal();});

const SLIDES=[
  ()=>`<h2>Willkommen beim Poker! 👋</h2>
    <p>Du lernst hier <b>Texas Hold'em</b> – die bekannteste Poker-Variante der Welt. Du spielst gegen 4 Computer-Gegner, und ein <b>Coach</b> erklärt dir jederzeit, was passiert und was du tun könntest.</p>
    <h4>Das Ziel</h4>
    <p>Gewinne Chips! Das geht auf zwei Wegen:</p>
    <ol><li>Du hast am Ende die <b>beste Hand</b> (beim „Showdown“).</li><li>Alle anderen <b>steigen aus</b>, weil du so überzeugend setzt – auch wenn deine Karten eigentlich schlecht sind. Das ist ein <b>Bluff</b>.</li></ol>
    <h4>Deine Gegner</h4>
    <div class="botlist">${BOT_DEFS.map(b=>`<div><div class="avatar" style="--c:${b.color};width:30px;height:30px">${b.name[0]}</div><div><b>${b.name} – ${b.title}</b><br>${b.desc}</div></div>`).join('')}</div>`,
  ()=>`<h2>Die Karten 🃏</h2>
    <p>Gespielt wird mit <b>52 Karten</b>: 4 Farben mit je 13 Werten.</p>
    <p>Farben: ♠ Pik, ♥ Herz, ♦ Karo, ♣ Kreuz. <b>Alle Farben sind gleich viel wert</b> – sie zählen nur, wenn du 5 Karten einer Farbe hast (Flush).</p>
    <p>Werte von niedrig nach hoch:</p>
    <p>${miniS('2c 3d 4h 5s 6c 7d 8h 9s Tc Jd Qh Ks Ac')}</p>
    <p><b>J</b> = Bube (Jack), <b>Q</b> = Dame (Queen), <b>K</b> = König, <b>A</b> = Ass. Das Ass ist die höchste Karte – kann aber in einer Straße auch ganz unten stehen: A-2-3-4-5.</p>`,
  ()=>`<h2>Deine Hand ✋</h2>
    <p>Jeder bekommt <b>2 verdeckte Karten</b>, die nur er sieht. In der Mitte werden nach und nach <b>5 Gemeinschaftskarten</b> aufgedeckt, die <b>allen</b> gehören.</p>
    <p>Du bildest die <b>beste Hand aus 5 Karten</b> – aus deinen 2 und den 5 in der Mitte, also aus 7 Karten. Du kannst beide, nur eine oder sogar keine deiner eigenen Karten benutzen.</p>
    <h4>Beispiel</h4>
    <p>Deine Karten: ${miniS('Kh Kd')} &nbsp; Mitte: ${miniS('Ks 7c 7h 2d 9s')}</p>
    <p>Beste Hand: ${miniS('Kh Kd Ks 7c 7h')} = <b>Full House</b> (drei Könige + zwei Siebenen). Die 2 und die 9 zählen nicht mit.</p>`,
  ()=>`<h2>Ablauf einer Hand 🔄</h2>
    <div class="flow"><div><b>1. Blinds</b>Zwei Spieler zahlen Pflichteinsätze.</div><div><b>2. Preflop</b>Jeder bekommt 2 Karten. 1. Setzrunde.</div><div><b>3. Flop</b>3 Karten in die Mitte. 2. Setzrunde.</div><div><b>4. Turn</b>4. Karte. 3. Setzrunde.</div><div><b>5. River</b>5. Karte. Letzte Setzrunde.</div><div><b>6. Showdown</b>Karten zeigen, beste Hand gewinnt.</div></div>
    <p>In jeder <b>Setzrunde</b> ist reihum (im Uhrzeigersinn) jeder dran. Eine Runde endet, wenn alle, die noch dabei sind, <b>gleich viel gesetzt</b> haben.</p>
    <p>Alle Einsätze landen im <b>Pot</b> in der Mitte – den bekommt der Gewinner.</p>
    <p>Bleibt vorher nur noch einer übrig (weil alle anderen ausgestiegen sind), gewinnt er sofort – ohne Showdown.</p>`,
  ()=>`<h2>Dealer-Button & Blinds 🔘</h2>
    <p>Der weiße Knopf <b>„D“</b> markiert den <b>Dealer</b> (Geber). Er wandert nach jeder Hand einen Platz weiter.</p>
    <ul><li>Links vom Dealer sitzt der <b>Small Blind (SB)</b>: muss <b>10</b> setzen.</li><li>Links davon der <b>Big Blind (BB)</b>: muss <b>20</b> setzen.</li></ul>
    <p>Diese Pflichteinsätze sorgen dafür, dass in jedem Pot etwas drin ist. Sonst würde jeder nur auf Asse warten.</p>
    <h4>Warum die Position wichtig ist</h4>
    <p>Ab dem Flop beginnt das Setzen links vom Dealer. Der Dealer selbst ist also <b>als Letzter</b> dran – er sieht, was alle anderen gemacht haben, bevor er sich entscheiden muss. Das ist ein großer Vorteil!</p>`,
  ()=>`<h2>Deine Möglichkeiten 🎮</h2>
    <p>Wenn du dran bist, hast du diese Optionen:</p>
    <div class="actgrid">
      <div><b>✔ Check</b><br>Nichts setzen und weitergeben. Nur möglich, wenn noch keiner gesetzt hat.</div>
      <div><b>💰 Bet</b><br>Als Erster in einer Runde etwas setzen.</div>
      <div><b>📞 Call</b><br>Mitgehen: den aktuellen Einsatz ausgleichen.</div>
      <div><b>⬆ Raise</b><br>Erhöhen: mehr setzen als der aktuelle Einsatz.</div>
      <div><b>✖ Fold</b><br>Aussteigen: Karten weg, bisherige Einsätze verloren.</div>
      <div><b>🔥 All-in</b><br>Alle deine Chips setzen. Du kannst dann nicht mehr rausgedrängt werden.</div>
    </div>
    <p style="margin-top:12px">Im Spiel: <b>F</b> = Fold, <b>C</b> = Check/Call, <b>R</b> = Bet/Raise. Fährst du mit der Maus über eine Taste, wird sie dir erklärt.</p>`,
  ()=>`<h2>Welche Hand gewinnt? 🏆</h2>
    <p>Von der besten zur schlechtesten:</p>
    ${rankingHTML(true)}
    <p class="note">Die ausführliche Liste findest du jederzeit oben unter „🏆 Hand-Rangfolge“.</p>`,
  ()=>`<h2>Die wichtigsten Strategie-Tipps 🧠</h2>
    <ol>
      <li><b>Wähle deine Starthände.</b> Die meisten Hände solltest du wegwerfen. Gute Spieler spielen nur ca. 20–25% ihrer Hände.</li>
      <li><b>Position zählt.</b> Spät dran zu sein (nahe am Button) ist ein Vorteil.</li>
      <li><b>Pot Odds.</b> Vergleiche, was ein Call kostet, mit dem, was du gewinnen kannst. Der Coach rechnet es dir vor.</li>
      <li><b>Outs zählen.</b> Outs sind Karten, die deine Hand verbessern. Faustregel: Outs × 4 (am Flop) bzw. × 2 (am Turn) ≈ Trefferchance in %.</li>
      <li><b>Achte auf Stärke.</b> Wenn ein vorsichtiger Spieler plötzlich hoch erhöht, hat er meistens etwas.</li>
    </ol>
    <p>Rechts siehst du immer den <b>Coach</b>: deine aktuelle Hand, deine Gewinnchance, eine Empfehlung und einen ausführlichen Spielverlauf. Viel Spaß! 🍀</p>`,
];
let slideI=0;
function showTutorial(i=0){
  slideI=i;
  const last=i===SLIDES.length-1;
  openModal(`<div class="slide">${SLIDES[i]()}</div><div class="tnav"><button class="ghost" id="tPrev" ${i===0?'style="visibility:hidden"':''}>← Zurück</button><div class="dots">${SLIDES.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div><button class="big" style="width:auto;padding:10px 20px" id="tNext">${last?'Los geht\'s! ▶':'Weiter →'}</button></div>`);
  $('#tPrev').onclick=()=>showTutorial(i-1);
  $('#tNext').onclick=()=>{if(last){closeModal();try{localStorage.setItem('pokerLernSeen','1');}catch(e){}if(!G.players.length)newGame();}else showTutorial(i+1);};
}
function rankingHTML(compact=false){
  const R=[
    ['Royal Flush','As Ks Qs Js Ts','A-K-Q-J-10 in einer Farbe. Unschlagbar.','0,003%'],
    ['Straight Flush','9h 8h 7h 6h 5h','Fünf Karten in Folge, alle gleiche Farbe.','0,03%'],
    ['Vierling','Qc Qd Qh Qs 7d','Vier Karten mit gleichem Wert (auch „Poker“ genannt).','0,17%'],
    ['Full House','Kh Kd Ks 4c 4h','Ein Drilling plus ein Paar.','2,6%'],
    ['Flush','Ad Jd 8d 5d 2d','Fünf Karten einer Farbe, Reihenfolge egal.','3,0%'],
    ['Straße','9c 8d 7s 6h 5c','Fünf Karten in Folge, Farbe egal. A-2-3-4-5 ist die kleinste.','4,6%'],
    ['Drilling','7h 7d 7c Ks 2d','Drei Karten mit gleichem Wert.','4,8%'],
    ['Zwei Paare','Jh Jc 4s 4d Ah','Zwei verschiedene Paare.','23,5%'],
    ['Ein Paar','Th Tc Ks 6d 3c','Zwei Karten mit gleichem Wert.','43,8%'],
    ['Höchste Karte','As Jd 8c 6h 3s','Nichts davon – die höchste Karte zählt.','17,4%'],
  ];
  return R.map((r,i)=>`<div class="rank-row"><div class="n">${i+1}</div><div><div class="t">${r[0]}</div>${compact?'':`<div class="d">${r[2]}</div><div class="pr">Wahrscheinlichkeit mit 7 Karten: ${r[3]}</div>`}</div>${miniS(r[1])}</div>`).join('');
}
function showRanking(){
  openModal(`<h2>Hand-Rangfolge 🏆</h2><p>Von der besten (1) zur schwächsten (10). Es zählen immer genau <b>5 Karten</b>.</p>${rankingHTML()}
  <h4>Gleichstand? So wird entschieden:</h4>
  <ul><li>Gleiche Kategorie → die höheren Karten gewinnen. Paar Könige schlägt Paar Damen.</li>
  <li>Gleiche Hauptkarten → die <b>Beikarten (Kicker)</b> entscheiden. A-A-K-7-3 schlägt A-A-Q-J-10.</li>
  <li>Alle 5 Karten gleich → der Pot wird <b>geteilt</b>. Die Farbe entscheidet nie!</li></ul>`);
}
function showGlossary(){
  const g=[
    ['Pot','Alle Chips in der Mitte, die der Gewinner der Hand bekommt.'],
    ['Blinds','Pflichteinsätze vor dem Austeilen: Small Blind (10) und Big Blind (20).'],
    ['Button / Dealer','Der Platz mit dem „D“-Knopf. Handelt ab dem Flop als Letzter.'],
    ['Hole Cards','Deine zwei verdeckten eigenen Karten.'],
    ['Board','Die Gemeinschaftskarten in der Mitte (Flop, Turn, River).'],
    ['Flop / Turn / River','Die 3., 4. und 5. Gemeinschaftskarte(n), die nacheinander aufgedeckt werden.'],
    ['Showdown','Am Ende zeigen alle verbliebenen Spieler ihre Karten.'],
    ['Check','Nichts setzen, aber drinbleiben (nur wenn niemand gesetzt hat).'],
    ['Bet / Raise','Setzen bzw. den Einsatz erhöhen.'],
    ['Call','Den aktuellen Einsatz mitgehen.'],
    ['Fold','Aussteigen – Karten weg.'],
    ['All-in','Alle eigenen Chips setzen.'],
    ['Side Pot','Ein Extra-Pot, wenn jemand All-in ist und andere mehr gesetzt haben. Der All-in-Spieler kann nur den Hauptpot gewinnen.'],
    ['Kicker','Die Beikarte, die bei gleicher Hand entscheidet.'],
    ['Suited / Offsuit','Zwei Startkarten in gleicher bzw. verschiedener Farbe (z.B. AKs / AKo).'],
    ['Pocket Pair','Ein Paar direkt in deinen zwei Startkarten.'],
    ['Draw','Eine unfertige Hand, der noch eine Karte fehlt (z.B. Flush-Draw).'],
    ['Outs','Karten im Stapel, die deine Hand zur (vermutlich) besten machen.'],
    ['Pot Odds','Verhältnis von Call-Preis zum Pot. Sagt dir, wie oft du gewinnen musst, damit sich ein Call lohnt.'],
    ['Equity','Dein Anteil am Pot laut Gewinnchance – im Spiel als „Gewinnchance“ angezeigt.'],
    ['Bluff','Setzen mit einer schwachen Hand, damit die anderen aussteigen.'],
    ['Value Bet','Setzen mit einer starken Hand, damit schlechtere Hände bezahlen.'],
    ['Nuts','Die bestmögliche Hand bei den aktuellen Gemeinschaftskarten.'],
    ['Split Pot','Gleichstand – der Pot wird geteilt.'],
  ];
  openModal(`<h2>Poker-Begriffe 🔤</h2><p>Die wichtigsten Wörter, die du am Pokertisch hörst:</p><dl class="gl">${g.map(x=>`<dt>${x[0]}</dt><dd>${x[1]}</dd>`).join('')}</dl>`);
}

/* =========================================================
   Events
   ========================================================= */
$('#btnFold').onclick=()=>humanDo({type:'fold'});
$('#btnCall').onclick=()=>{const me=G.players[0];humanDo({type:G.currentBet-me.bet>0?'call':'check'});};
$('#btnRaise').onclick=()=>humanDo({type:'raise',to:+$('#raiseRange').value});
$('#raiseRange').oninput=updateRaiseLabel;
document.querySelectorAll('.pre').forEach(b=>b.onclick=()=>{$('#raiseRange').value=presetTo(b.dataset.p);updateRaiseLabel();
  const t={min:'<b>Min</b> = die kleinstmögliche Erhöhung (mindestens so viel wie die letzte Erhöhung).',half:'<b>½ Pot</b> = eine halbe Pot-Größe. Ein beliebter, mittelgroßer Einsatz.',pot:'<b>Pot</b> = so viel, wie im Pot liegt. Ein großer, starker Einsatz.',all:'<b>All-in</b> = alle Chips! Maximaler Druck – aber auch maximales Risiko.'}[b.dataset.p];$('#explain').innerHTML=t;});
['btnFold','btnCall','btnRaise'].forEach(id=>{const b=$('#'+id);const f=()=>{if(!b.disabled&&G.resolveHuman)$('#explain').innerHTML=EXPLAIN[id]();};b.addEventListener('mouseenter',f);b.addEventListener('focus',f);});
$('#nextBtn').onclick=()=>{if(G.handOver)startHand();};
$('#ffBtn').onclick=()=>{ff=true;$('#ffBtn').classList.add('hidden');};
document.addEventListener('keydown',e=>{
  if($('#modal').classList.contains('open')){if(e.key==='Escape'&&!modalLocked)closeModal();return;}
  if(e.target.tagName==='INPUT'&&e.key!=='Enter')return;
  const k=e.key.toLowerCase();
  if(G.resolveHuman){
    if(k==='f')$('#btnFold').click();
    else if(k==='c')$('#btnCall').click();
    else if(k==='r'&&!$('#btnRaise').disabled)$('#btnRaise').click();
  }else if(k==='enter'&&G.handOver&&!$('#nextArea').classList.contains('hidden'))startHand();
});
$('#hTut').onclick=()=>showTutorial(0);
$('#hRank').onclick=showRanking;
$('#hGloss').onclick=showGlossary;
$('#hNew').onclick=()=>{if(confirm('Wirklich ein neues Spiel starten? Der aktuelle Stand geht verloren.')){try{sessionStorage.setItem('pokerLernRestart','1');}catch(e){}location.reload();}};
const spd=$('#hSpeed');spd.value=String(settings.speed);if(!spd.value){spd.value='1';settings.speed=1;}
spd.onchange=()=>{settings.speed=+spd.value;saveSettings();};
const tips=$('#hTips');const syncTips=()=>tips.classList.toggle('on',settings.tips);syncTips();
tips.onclick=()=>{settings.tips=!settings.tips;saveSettings();syncTips();if(G.resolveHuman)updateCoach(true);};
const snd=$('#hSound');const syncSnd=()=>{snd.textContent=settings.sound?'🔊':'🔇';};syncSnd();
snd.onclick=()=>{settings.sound=!settings.sound;saveSettings();syncSnd();};

/* Handy, Touch & Web-App */
const TOUCH=matchMedia('(hover:none)').matches;
if(TOUCH)$('#explain').innerHTML='Tippe auf eine Taste, um zu handeln. Erklärungen stehen beim Coach und im Spielverlauf.';
phoneMQ.addEventListener('change',applyPositions);
$('#mcoach').onclick=()=>$('#oddsBox').scrollIntoView({behavior:'smooth',block:'start'});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});

/* Start */
let seen=false,restart=false;
try{seen=!!localStorage.getItem('pokerLernSeen');restart=!!sessionStorage.getItem('pokerLernRestart');sessionStorage.removeItem('pokerLernRestart');}catch(e){}
G.stage='preflop';
$('#handBox').innerHTML='<h3><span class="dot"></span>Deine Hand</h3><p>Sobald das Spiel startet, siehst du hier deine Karten und was sie wert sind.</p>';
$('#oddsBox').classList.add('hidden');
renderPhase();
if(seen||restart)newGame();else showTutorial(0);
</script>
